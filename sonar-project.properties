sonar.projectKey=nodejs-backend-app
sonar.projectName=NodeJS Backend App

sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/*.test.ts

sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/server.ts,**/index.ts,**/*.dto.ts,**/*.entity.ts